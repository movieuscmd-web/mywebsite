<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Secure Chat</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui,Segoe UI,Roboto}
.centerWrap{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.bigCard{background:#1e1e1e;padding:25px;border-radius:16px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.6);border:1px solid #2a2a2a}
h2,h3{margin:0 0 12px}
.box{background:#222;padding:12px;border-radius:10px;margin:12px 0;border:1px solid #333}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#121212;color:#fff;margin:6px 0;outline:none}
input:focus{border-color:#6c5ce7}
button{width:100%;padding:13px;border-radius:10px;border:none;background:#6c5ce7;color:#fff;font-weight:700;cursor:pointer;margin-top:8px;font-size:15px}
button:disabled{opacity:.35;cursor:not-allowed}
button.active{background:#00b894 !important}
#chatUI header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1a1a1a;border-bottom:1px solid #2a2a2a}
.chatWrap{display:flex;gap:10px;height:calc(100vh - 56px);padding:10px}
#users{width:32%;background:#1a1a1a;border-radius:12px;padding:10px;overflow:auto}
#chatArea{flex:1;background:#1a1a1a;border-radius:12px;display:flex;flex-direction:column}
#messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;word-break:break-word;font-size:14px;line-height:1.4}
.msg.anon{background:#2a2a2a;align-self:flex-start}
.msg.me{background:#6c5ce7;align-self:flex-end}
.msg.other{background:#333;align-self:flex-start}
.user{background:#222;padding:10px;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1px solid #2a2a2a}
.user:hover{background:#2e2e2e}
#topUser{color:#00ff88;font-size:12px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="centerWrap">
  <div class="bigCard">
    <h2>🔒 Anonymous Chat</h2>
    <p style="color:#aaa;font-size:13px">Secure • Encrypted • No History</p>
    <div class="box">
      <input id="username" placeholder="Username (min 2 char)">
      <input id="password" type="password" placeholder="Password (any)">
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin:10px 0">
      <input type="checkbox" id="robotCheck" onclick="openCaptcha()" style="width:18px">
      <label>I am not a robot</label>
    </div>
    <p id="robotMsg" style="display:none;color:#ff7675;font-size:12px">⚠️ Please verify captcha first</p>
    <button id="loginBtn" onclick="login()" disabled>Login</button>
    <button id="regBtn" onclick="register()" disabled style="background:#2d3436">Register</button>
    <p id="msg1" style="color:#00ff88;font-size:13px;margin-top:10px"></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <!-- ROOM ENTRY -->
  <div id="needRoom" class="centerWrap">
    <div class="bigCard">
      <h3>Enter Room Code</h3>
      <p style="color:#aaa;font-size:12px">Share this code with friend to chat</p>
      <p id="generatedCode" style="font-weight:900;color:#00ff88;font-size:22px;letter-spacing:2px;text-align:center;margin:15px 0"></p>
      <input id="roomCode" placeholder="e.g. TIGER-1234">
      <button onclick="enterChat()">Enter Chat Room</button>
      <p id="msg2" style="color:#ff7675;font-size:13px"></p>
    </div>
  </div>

  <!-- CHAT UI -->
  <div id="chatUI" style="display:none">
    <header>
      <div><b id="roomName">ROOM</b> <span id="encInfo" style="font-size:11px;color:#00b894;margin-left:8px">● Firebase Live</span></div>
      <div style="display:flex;gap:12px;align-items:center"><span>👥 <span id="count">0</span></span><span id="topUser"></span></div>
    </header>
    <div class="chatWrap">
      <div id="users">
        <b id="online-count">0 online</b>
        <div id="userList" style="margin-top:12px"></div>
      </div>
      <div id="chatArea">
        <div style="display:flex;gap:6px;padding:8px;border-bottom:1px solid #2a2a2a">
          <button id="btnPublic" class="active" onclick="switchChat('public')" style="width:50%">🌍 Public</button>
          <button id="btnPrivate" onclick="switchChat('private')" style="width:50%;background:#2d3436">🔒 Private</button>
        </div>
        <div id="messages"></div>
        <div style="display:flex;gap:6px;padding:10px;border-top:1px solid #2a2a2a">
          <input id="msgInput" placeholder="Type message..." style="flex:1;margin:0">
          <button onclick="sendMsg()" style="width:80px;margin:0">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CAPTCHA MODAL -->
<div id="captchaModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:9999">
  <div class="bigCard" style="max-width:320px">
    <h3 id="captchaQ">Verification</h3>
    <p id="captchaDesc" style="color:#aaa"></p>
    <input id="captchaInput" placeholder="Your answer" type="number">
    <button onclick="verifyCaptcha()">Verify</button>
    <p id="captchaErr" style="color:#ff7675;font-size:13px;margin-top:8px"></p>
  </div>
</div>

<script>
// ---------- CAPTCHA ----------
let currentAnswer=0, robotVerified=false;
function openCaptcha(){
  if(robotVerified) return;
  robotCheck.checked=false;
  captchaModal.style.display='flex';
  let a=Math.floor(3+Math.random()*9), b=Math.floor(1+Math.random()*9);
  currentAnswer=a+b;
  document.getElementById('captchaQ').innerText='🤖 I am not robot';
  document.getElementById('captchaDesc').innerText=`Solve: ${a} + ${b} = ?`;
  document.getElementById('captchaInput').value='';
  document.getElementById('captchaErr').innerText='';
}
function verifyCaptcha(){
  let v=parseInt(document.getElementById('captchaInput').value);
  if(v===currentAnswer){
    robotVerified=true;
    captchaModal.style.display='none';
    robotCheck.checked=true;
    loginBtn.disabled=false;
    regBtn.disabled=false;
    robotMsg.style.display='none';
  }else{
    document.getElementById('captchaErr').innerText='❌ Wrong answer, try again';
  }
}

// ---------- FIREBASE ----------
const firebaseConfig = {
  apiKey: "AIzaSyAeu9siRl8xVuoSAiQV7V_yKhR8k9pQ6YQ",
  authDomain: "anonymouschat-c18a4.firebaseapp.com",
  databaseURL: "https://anonymouschat-c18a4-default-rtdb.firebaseio.com",
  projectId: "anonymouschat-c18a4",
  storageBucket: "anonymouschat-c18a4.firebasestorage.app",
  messagingSenderId: "1040348512886",
  appId: "1:1040348512886:web:37d6ff2cc2b8b2dd2b2b8f5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------- APP LOGIC ----------
const words=["TIGER","GHOST","NINJA","WOLF","EAGLE","SHARK","FIRE","ICE","STORM","SHADOW","FOX","LION","DRAGON","VIPER","COBRA","PHANTOM","BLAZE","FROST"];
let myId=null, myRoom=null, chatMode='public', selectedUser=null;

function generateCode(){
  let w=words[Math.floor(Math.random()*words.length)];
  let n=Math.floor(1000+Math.random()*9000);
  let c=w+"-"+n;
  document.getElementById('generatedCode').innerText=c;
  document.getElementById('roomCode').value=c;
}
generateCode();

function register(){
  if(!robotVerified){robotMsg.style.display='block';return;}
  let u=username.value.trim();
  if(u.length<2) return alert('Username min 2 char');
  localStorage.setItem('anonUser',u);
  msg1.innerText="✅ Account created! Now click Login";
}
function login(){
  if(!robotVerified){robotMsg.style.display='block';return;}
  let u=username.value.trim();
  if(u.length<2) return alert('Username min 2 char');
  myId=u;
  localStorage.setItem('anonUser',myId);
  loginScreen.style.display='none';
  mainApp.style.display='block';
  topUser.innerText='🔒 '+myId;
}
function enterChat(){
  let code=roomCode.value.trim().toUpperCase();
  if(code.length<4){msg2.innerText="Enter valid room code";return;}
  myRoom=code;
  if(!myId) myId=localStorage.getItem('anonUser')||"User"+Math.floor(Math.random()*999);
  needRoom.style.display='none';
  chatUI.style.display='block';
  roomName.innerText=myRoom;
  initChat();
}

function initChat(){
  const presenceRef = db.ref('rooms/'+myRoom+'/presence');
  const myRef = presenceRef.child(myId);
  db.ref('.info/connected').on('value', s=>{
    if(s.val()){
      myRef.onDisconnect().remove();
      myRef.set({id:myId, time:Date.now()});
    }
  });
  presenceRef.on('value', snap=>{
    let c=snap.numChildren();
    count.innerText=c;
    document.getElementById('online-count').innerText=c+' online';
    let html='';
    snap.forEach(ch=>{
      let u=ch.val();
      if(!u || u.id==myId) return;
      html+=`<div class="user" onclick="openPrivate('${u.id}')"><b>🕶️ ${u.id}</b><br><small style="color:#00b894">tap → private chat</small></div>`;
    });
    userList.innerHTML=html||'<small style="color:#666">No other user online</small>';
  });

  // Public messages
  db.ref('rooms/'+myRoom+'/public').limitToLast(100).off();
  db.ref('rooms/'+myRoom+'/public').limitToLast(100).on('child_added', snap=>{
    let m=snap.val();
    if(!m) return;
    if(chatMode==='public') addPublicMsg(m.text, m.from);
  });
}

function switchChat(mode){
  chatMode=mode;
  btnPublic.classList.toggle('active',mode==='public');
  btnPrivate.classList.toggle('active',mode==='private');
  messages.innerHTML='';
  if(mode==='public'){
    messages.innerHTML=`<p style="text-align:center;color:#00b894;font-size:11px">🌍 Public Room ${myRoom} - All messages visible</p>`;
  }else{
    messages.innerHTML=`<p style="text-align:center;color:#aaa;font-size:11px">🔒 Select a user from left side for private chat</p>`;
  }
}
function addPublicMsg(t, from){
  let d=document.createElement('div');
  d.className='msg anon';
  let isMe = from===myId;
  d.className = isMe ? 'msg me' : 'msg anon';
  d.innerText = (isMe ? 'You: ' : '🕶️ '+from+': ') + t;
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;
}
function addPrivateMsg(t, ty){
  let d=document.createElement('div');
  d.className='msg '+ty;
  d.innerText=t;
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;
}
function openPrivate(id){
  selectedUser=id;
  chatMode='private';
  btnPublic.classList.remove('active');
  btnPrivate.classList.add('active');
  messages.innerHTML=`<p style="text-align:center;color:#00b894;font-size:12px">🔒 Private chat with ${id} (End-to-End)</p>`;
  let chatId=[myId,id].sort().join('_');
  db.ref('rooms/'+myRoom+'/private/'+chatId).limitToLast(100).off();
  db.ref('rooms/'+myRoom+'/private/'+chatId).limitToLast(100).on('child_added', snap=>{
    let m=snap.val();
    if(!m) return;
    addPrivateMsg(m.text, m.from==myId?'me':'other');
  });
}
function sendMsg(){
  let t=msgInput.value.trim();
  if(!t) return;
  if(chatMode==='public'){
    db.ref('rooms/'+myRoom+'/public').push({text:t,from:myId,time:Date.now()});
  }else{
    if(!selectedUser) return alert('Left side se user select karo private ke liye');
    let chatId=[myId,selectedUser].sort().join('_');
    db.ref('rooms/'+myRoom+'/private/'+chatId).push({text:t,from:myId,time:Date.now()});
  }
  msgInput.value='';
}
msgInput.addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg();});
</script>
</body>
</html>
